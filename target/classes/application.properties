# Cấu hình SQL Server
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=RetailOnboardPro;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=haingoc@123
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server
server.port=5000
# server.servlet.context-path=/api

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Tự động mở trình duyệt khi khởi động
spring.main.web-application-type=servlet
spring.devtools.restart.enabled=true

# JWT Configuration
app.jwt.secret=retail0onboard1pro2security3key4very5strong6and7secure8token9key
app.jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true 